<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilemmas & Advice - Real Deck</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffc0cb 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* Controle de Áudio */
        .audio-control {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(214, 51, 132, 0.3);
            z-index: 1000;
            transition: background 0.2s;
        }
        .audio-control:hover { background: #c22573; }

        h1 {
            color: #d63384;
            text-align: center;
            margin-bottom: 5px;
            font-size: 2rem;
            z-index: 100;
        }

        p.subtitle {
            text-align: center;
            color: #854d63;
            margin-bottom: 40px;
            font-size: 0.9rem;
            z-index: 100;
        }

        /* Container do Baralho (onde as cartas se empilham) */
        #deck-container {
            position: relative;
            width: 320px;
            height: 420px;
            margin-bottom: 40px;
        }

        /* Estrutura individual de cada carta */
        .card-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.6s ease-in-out, opacity 0.5s ease;
        }

        /* Animação da carta saindo do monte */
        .card-wrapper.fly-away {
            transform: translateX(150%) rotate(25deg) !important;
            opacity: 0;
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: -2px 5px 15px rgba(0, 0, 0, 0.1);
            border-radius: 25px;
        }

        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            background: #ffffff;
            border: 4px solid #ffb3c6;
        }

        .card-back {
            background: #ffb3c6;
            color: #ffffff;
            transform: rotateY(180deg);
        }

        .tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #d63384;
        }

        .card-back .tag {
            color: #fff;
            background: rgba(214, 51, 132, 0.3);
            padding: 5px 12px;
            border-radius: 10px;
        }

        .dilemma-text {
            font-size: 1.1rem;
            line-height: 1.5;
            font-weight: 600;
            color: #4a4a4a;
        }

        .prompt-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 15px;
            background: rgba(255,255,255,0.3);
            padding: 15px 20px;
            border-radius: 15px;
            color: #854d63;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        #next-btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
            z-index: 100;
        }

        #next-btn:hover { background-color: #c22573; transform: translateY(-3px); }
        #next-btn:active { transform: translateY(1px); }
        
        .empty-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #d63384;
            font-weight: bold;
            text-align: center;
            display: none;
        }

    </script>
</head>
<body>

    <!-- Áudio de fundo (Som ambiente de Café) -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
    </audio>
    <button class="audio-control" onclick="toggleAudio()" id="audio-btn">🎵 Play Music</button>

    <h1>Dilemmas & Advice 🔮</h1>
    <p class="subtitle">Tap the top card to flip it. Click "Draw Next" to pull a new one!</p>

    <!-- O monte onde as cartas serão injetadas via JavaScript -->
    <div id="deck-container">
        <div class="empty-message" id="empty-msg">🎉 Deck Empty!<br><br>You've answered all dilemmas!</div>
    </div>

    <button id="next-btn" onclick="drawCard()">Draw Next Card 🃏</button>

    <script>
        const originalDeck = [
            { emoji: "📱", tag: "Everyday Drama", text: "I accidentally liked a very old photo of my crush on Instagram from 2019, and they are online right now. What should I do?" },
            { emoji: "🎂", tag: "Everyday Drama", text: "My two best friends are having their birthday parties on the exact same day and time, and they both expect me to be there." },
            { emoji: "☕", tag: "Everyday Drama", text: "I borrowed my sister's favorite jacket without asking, and I just spilled a huge cup of coffee all over it. She's coming home in an hour." },
            { emoji: "🚨", tag: "Everyday Drama", text: "I sent a voice message complaining about my math teacher, but I accidentally sent it directly to his WhatsApp! I can't delete it anymore." },
            { emoji: "🐾", tag: "Absurd Situation", text: "I just woke up, walked into my living room, and there are three female cats and two dogs looking at me. I don't own any pets!" },
            { emoji: "🤧", tag: "Absurd Situation", text: "I'm at a fancy dinner party, and right before they cut the cake, I accidentally sneezed all over it. Nobody saw me do it, but the cake is ruined." },
            { emoji: "💰", tag: "Absurd Situation", text: "I was walking to school and I found a bag with $10,000 inside and a note that just says 'Run'. What should I do?" },
            { emoji: "⚡", tag: "Absurd Situation", text: "I just realized that every time I blink, I teleport one meter forward. It's getting really hard to walk normally in public." }
        ];

        let currentZIndex = originalDeck.length;

        // Embaralha a array
        function shuffleDeck(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Constrói o baralho fisicamente na tela
        function buildDeck() {
            const container = document.getElementById('deck-container');
            const emptyMsg = document.getElementById('empty-msg');
            
            // Limpa as cartas antigas mantendo a mensagem de fim de jogo
            container.innerHTML = '';
            container.appendChild(emptyMsg);
            emptyMsg.style.display = 'none';
            document.getElementById('next-btn').innerHTML = "Draw Next Card 🃏";

            let shuffledCards = shuffleDeck([...originalDeck]);
            currentZIndex = shuffledCards.length;

            shuffledCards.forEach((card, index) => {
                // Cria o elemento da carta
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-wrapper';
                cardDiv.setAttribute('data-index', index);
                
                // Aplica uma rotação leve e aleatória para parecer um monte real
                const randomRotation = (Math.random() * 6) - 3; 
                cardDiv.style.transform = `rotate(${randomRotation}deg)`;
                cardDiv.style.zIndex = index + 1; // A última carta do array fica no topo

                // HTML interno da carta (Frente e Verso)
                cardDiv.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="emoji">${card.emoji}</div>
                            <div class="tag">${card.tag}</div>
                            <div class="dilemma-text">${card.text}</div>
                        </div>
                        <div class="card-back">
                            <div class="tag">Your Turn</div>
                            <div>Start your answer with:</div>
                            <div class="prompt-text">"If I were you, I would..."</div>
                        </div>
                    </div>
                `;

                // Adiciona o evento de virar a carta ao clicar
                cardDiv.addEventListener('click', function() {
                    this.classList.toggle('flipped');
                });

                container.appendChild(cardDiv);
            });
        }

        // Função para puxar a carta de cima
        function drawCard() {
            // Seleciona todas as cartas que ainda não voaram da tela
            const remainingCards = Array.from(document.querySelectorAll('.card-wrapper:not(.fly-away)'));
            
            if (remainingCards.length === 0) {
                // Se acabou, reconstrói o baralho
                buildDeck();
                return;
            }

            // Encontra a carta com o maior z-index (a do topo)
            let topCard = remainingCards.reduce((highest, card) => {
                return (parseInt(card.style.zIndex) > parseInt(highest.style.zIndex)) ? card : highest;
            });

            // Aplica a animação de deslizar para fora
            topCard.classList.add('fly-away');

            // Muda o texto do botão se for a última carta
            if (remainingCards.length === 1) {
                setTimeout(() => {
                    document.getElementById('empty-msg').style.display = 'block';
                    document.getElementById('next-btn').innerHTML = "Shuffle & Play Again 🔀";
                }, 500);
            }
        }

        // Controle da Música
        function toggleAudio() {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('audio-btn');
            
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "⏸️ Pause Music";
            } else {
                audio.pause();
                btn.innerHTML = "🎵 Play Music";
            }
        }

        // Constrói o baralho quando a página carrega
        window.onload = buildDeck;
    </script>
</body>
</html>
