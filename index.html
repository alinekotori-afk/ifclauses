<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilemmas & Advice - Flashcards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: #ffe6ea;
            background: linear-gradient(135deg, #fff0f3 0%, #ffc0cb 100%);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            overflow: hidden;
        }

        #music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(214, 51, 132, 0.3);
            z-index: 1000;
        }

        h1 {
            color: #d63384;
            text-align: center;
            margin-bottom: 5px;
            font-size: 2rem;
            z-index: 100;
        }

        p.subtitle {
            text-align: center;
            color: #854d63;
            margin-bottom: 40px;
            font-size: 0.9rem;
            z-index: 100;
        }

        #deck-wrapper {
            position: relative;
            width: 320px;
            height: 420px;
            margin-bottom: 40px;
        }

        #deck-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #empty-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: #d63384;
            font-weight: bold;
            text-align: center;
            display: none;
            width: 100%;
        }

        .card-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-perspective: 1000px;
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.4s ease;
        }

        .card-wrapper.fly-away {
            transform: translateX(120vw) rotate(45deg) !important;
            opacity: 0;
            pointer-events: none;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            box-shadow: -3px 5px 15px rgba(214, 51, 132, 0.25);
            border-radius: 25px;
        }

        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            border: 4px solid #ffb3c6;
        }

        .card-front {
            background: #ffffff;
            z-index: 2;
        }

        .card-back {
            background: #ffb3c6;
            color: #ffffff;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            z-index: 1;
        }

        .tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #d63384;
        }

        .card-back .tag {
            color: #fff;
            background: rgba(214, 51, 132, 0.3);
            padding: 5px 12px;
            border-radius: 10px;
        }

        .dilemma-text {
            font-size: 1.1rem;
            line-height: 1.5;
            font-weight: 600;
            color: #4a4a4a;
        }

        .prompt-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 15px;
            background: rgba(255,255,255,0.3);
            padding: 15px 20px;
            border-radius: 15px;
            color: #854d63;
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        #next-btn {
            background-color: #d63384;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.4);
            font-family: 'Poppins', sans-serif;
            z-index: 100;
        }
    </style>
</head>
<body>

    <audio id="sfx-flip" src="https://actions.google.com/sounds/v1/water/water_drop.ogg"></audio>
    <audio id="sfx-draw" src="https://actions.google.com/sounds/v1/paper/paper_flutter.ogg"></audio>
    <audio id="bg-music" src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" loop></audio>

    <button id="music-btn" onclick="toggleMusic()">🎵 Play Music</button>

    <h1>Dilemmas & Advice 🔮</h1>
    <p class="subtitle">Tap the top card to flip it. Click "Draw Next" to pull a new one!</p>

    <div id="deck-wrapper">
        <div id="empty-msg">🎉 Deck Empty!<br><br>You survived the dilemmas!</div>
        <div id="deck-container"></div>
    </div>

    <button id="next-btn" onclick="drawCard()">Draw Next Card 🃏</button>

    <script>
        const deckData = [
            { emoji: "📱", tag: "Everyday Drama", text: "I accidentally liked a very old photo of my crush on Instagram from 2019, and they are online right now. What should I do?" },
            { emoji: "🎂", tag: "Everyday Drama", text: "My two best friends are having their birthday parties on the exact same day and time, and they both expect me to be there." },
            { emoji: "☕", tag: "Everyday Drama", text: "I borrowed my sister's favorite jacket without asking, and I just spilled a huge cup of coffee all over it." },
            { emoji: "🚨", tag: "Everyday Drama", text: "I sent a voice message complaining about my math teacher, but I accidentally sent it directly to his WhatsApp!" },
            { emoji: "🐾", tag: "Absurd Situation", text: "I just woke up, walked into my living room, and there are three female cats and two dogs looking at me. I don't own any pets!" },
            { emoji: "🤧", tag: "Absurd Situation", text: "I'm at a fancy dinner party, and right before they cut the cake, I accidentally sneezed all over it." },
            { emoji: "💰", tag: "Absurd Situation", text: "I was walking to school and I found a bag with $10,000 inside and a note that just says 'Run'. What should I do?" },
            { emoji: "⚡", tag: "Absurd Situation", text: "I just realized that every time I blink, I teleport one meter forward. It's getting really hard to walk normally in public." }
        ];

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initDeck() {
            try {
                const container = document.getElementById('deck-container');
                const emptyMsg = document.getElementById('empty-msg');
                const nextBtn = document.getElementById('next-btn');

                container.innerHTML = ''; 
                emptyMsg.style.display = 'none'; 
                nextBtn.innerHTML = 'Draw Next Card 🃏';

                const shuffledCards = shuffle([...deckData]);

                shuffledCards.forEach((card, index) => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'card-wrapper';
                    cardEl.style.zIndex = index; 

                    const randomRot = (Math.random() * 8) - 4;
                    cardEl.style.transform = `rotate(${randomRot}deg)`;

                    cardEl.innerHTML = `
                        <div class="card-inner">
                            <div class="card-front">
                                <div class="emoji">${card.emoji}</div>
                                <div class="tag">${card.tag}</div>
                                <div class="dilemma-text">${card.text}</div>
                            </div>
                            <div class="card-back">
                                <div class="tag">Your Turn</div>
                                <div>Start your answer with:</div>
                                <div class="prompt-text">"If I were you, I would..."</div>
                            </div>
                        </div>
                    `;

                    cardEl.addEventListener('click', function() {
                        this.classList.toggle('flipped');
                        try {
                            const sfxFlip = document.getElementById('sfx-flip');
                            sfxFlip.currentTime = 0;
                            sfxFlip.play().catch(() => {}); 
                        } catch (e) {}
                    });

                    container.appendChild(cardEl);
                });
            } catch (error) {
                console.error("Erro ao carregar o baralho:", error);
            }
        }

        function drawCard() {
            const container = document.getElementById('deck-container');
            const remainingCards = Array.from(container.querySelectorAll('.card-wrapper:not(.fly-away)'));

            if (remainingCards.length === 0) {
                initDeck(); 
                return;
            }

            try {
                const sfxDraw = document.getElementById('sfx-draw');
                sfxDraw.currentTime = 0;
                sfxDraw.play().catch(() => {});
            } catch (e) {}

            const topCard = remainingCards[remainingCards.length - 1];
            topCard.classList.add('fly-away');

            if (remainingCards.length === 1) {
                setTimeout(() => {
                    document.getElementById('empty-msg').style.display = 'block';
                    document.getElementById('next-btn').innerHTML = 'Shuffle & Play Again 🔀';
                }, 400); 
            }
        }

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-btn');

            if (music.paused) {
                music.play().catch(() => alert('Clique na tela uma vez antes de iniciar a música!'));
                btn.innerHTML = '⏸️ Pause Music';
            } else {
                music.pause();
                btn.innerHTML = '🎵 Play Music';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDeck();
        });
    </script>
</body>
</html>
